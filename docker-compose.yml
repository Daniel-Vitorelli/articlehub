services:
  articlehub:
    build: .
    image: articlehub:latest
    environment:
      - APP_ENV=prod
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - articlehub-sessions:/var/lib/php/sessions
    networks:
      - net
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      labels:
        - "traefik.enable=true"
        - "traefik.http.services.articlehub-service.loadbalancer.server.port=80"

        # HTTPS via Let's Encrypt
        - "traefik.http.routers.articlehub-main.rule=Host(`articlehub.ai-equinox.com`)"
        - "traefik.http.routers.articlehub-main.entrypoints=websecure"
        - "traefik.http.routers.articlehub-main.tls=true"
        - "traefik.http.routers.articlehub-main.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.articlehub-main.service=articlehub-service"

        # HTTP por IP (opcional)
        - "traefik.http.routers.articlehub-ip.rule=HostRegexp(`{host:5\\.189\\.166\\.47}`)"
        - "traefik.http.routers.articlehub-ip.entrypoints=web"
        - "traefik.http.routers.articlehub-ip.service=articlehub-service"

networks:
  net:
    external: true

volumes:
  articlehub-sessions:
